name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version to install (honors global.json where present)
        type: string
        default: "9.0.x"
      working-directory:
        description: Directory to run the build in
        type: string
        default: "."
      solution:
        description: Path to a .sln/.csproj (blank = autodetect in working-directory)
        type: string
        default: ""
      configuration:
        description: Build configuration
        type: string
        default: Release

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --configuration ${{ inputs.configuration }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ inputs.solution }}
          --configuration ${{ inputs.configuration }} --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
